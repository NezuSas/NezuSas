<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="NEZU Atria. ['La casa sigue respondiendo aunque se caiga internet.', 'Consola propia en teléfono, tablet y kiosko, asistente por', 'voz con autorización explícita y acceso remoto opcional.']">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17221C"/><stop offset="1" stop-color="#0F1713"/></linearGradient>
    <radialGradient id="g" cx="82%" cy="40%" r="50%"><stop offset="0" stop-color="#D9542B" stop-opacity="0.22"/><stop offset="1" stop-color="#D9542B" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="600" height="300" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#c)"><rect width="600" height="300" fill="url(#bg)"/><rect width="600" height="300" fill="url(#g)"/></g>
  <rect x="0.5" y="0.5" width="599" height="299" rx="22" fill="none" stroke="#243029"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="28" y="48" fill="#D9542B" font-size="11" font-weight="700" letter-spacing="2.2">PLATAFORMA · AUTOMATIZACIÓN RESIDENCIAL</text>
    <text x="28" y="92" fill="#F3F4EE" font-size="34" font-weight="800">NEZU Atria</text>
    <text x="28" y="124" fill="#A9B1A8" font-size="15">La casa sigue respondiendo aunque se caiga internet.</text>
    <text x="28" y="146" fill="#A9B1A8" font-size="15">Consola propia en teléfono, tablet y kiosko, asistente por</text>
    <text x="28" y="168" fill="#A9B1A8" font-size="15">voz con autorización explícita y acceso remoto opcional.</text>
    <rect x="28" y="238" width="86" height="26" rx="13" fill="#111A16" stroke="#243029"/><text x="71" y="255" text-anchor="middle" fill="#A9B1A8" font-size="11" font-weight="600" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace">TypeScript</text><rect x="122.0" y="238" width="64" height="26" rx="13" fill="#111A16" stroke="#243029"/><text x="154" y="255" text-anchor="middle" fill="#A9B1A8" font-size="11" font-weight="600" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace">Fastify</text><rect x="194.4" y="238" width="50" height="26" rx="13" fill="#111A16" stroke="#243029"/><text x="219" y="255" text-anchor="middle" fill="#A9B1A8" font-size="11" font-weight="600" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace">React</text><rect x="252.4" y="238" width="57" height="26" rx="13" fill="#111A16" stroke="#243029"/><text x="281" y="255" text-anchor="middle" fill="#A9B1A8" font-size="11" font-weight="600" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace">SQLite</text><rect x="317.6" y="238" width="57" height="26" rx="13" fill="#111A16" stroke="#243029"/><text x="346" y="255" text-anchor="middle" fill="#A9B1A8" font-size="11" font-weight="600" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace">Docker</text>
  </g>
  <g transform="translate(400,40)">
    <!-- house with pulsing nodes -->
    <path d="M20 90 L90 30 L160 90" fill="none" stroke="#D9542B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 84 V170 H144 V84" fill="none" stroke="#D9542B" stroke-width="5" stroke-linejoin="round"/>
    <rect x="76" y="126" width="28" height="44" rx="3" fill="none" stroke="#C2461F" stroke-width="4"/>
    <g stroke="#243029" stroke-width="2"><line x1="90" y1="110" x2="52" y2="104"/><line x1="90" y1="110" x2="128" y2="104"/><line x1="90" y1="110" x2="56" y2="150"/><line x1="90" y1="110" x2="124" y2="150"/></g>
    <g stroke="#C9DF38" stroke-width="2" stroke-dasharray="4 60" stroke-linecap="round"><line x1="90" y1="110" x2="52" y2="104"><animate attributeName="stroke-dashoffset" from="64" to="0" dur="2s" repeatCount="indefinite"/></line><line x1="90" y1="110" x2="128" y2="104"><animate attributeName="stroke-dashoffset" from="64" to="0" dur="2.6s" repeatCount="indefinite"/></line><line x1="90" y1="110" x2="56" y2="150"><animate attributeName="stroke-dashoffset" from="64" to="0" dur="2.3s" repeatCount="indefinite"/></line><line x1="90" y1="110" x2="124" y2="150"><animate attributeName="stroke-dashoffset" from="64" to="0" dur="1.9s" repeatCount="indefinite"/></line></g>
    <circle cx="90" cy="110" r="9" fill="#111A16" stroke="#D9542B" stroke-width="3"/>
    <g fill="#C9DF38"><circle cx="52" cy="104" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle><circle cx="128" cy="104" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="56" cy="150" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.3s" repeatCount="indefinite"/></circle><circle cx="124" cy="150" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></circle></g>
    <!-- offline badge -->
    <rect x="18" y="190" width="146" height="26" rx="13" fill="#111A16" stroke="#243029"/><circle cx="34" cy="203" r="4" fill="#C9DF38"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="46" y="207" fill="#A9B1A8" font-size="11" font-weight="700" letter-spacing="1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">FUNCIONA SIN INTERNET</text></g>
</svg>
