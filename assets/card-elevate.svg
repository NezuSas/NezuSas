<svg xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230" role="img" aria-label="Empresas y edificios. Monitoreo, control de acceso, seguridad y automatización para oficinas, comercios y edificios en operación.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17221C"/><stop offset="1" stop-color="#0F1713"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D9542B"/><stop offset="1" stop-color="#C9DF38"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="399" height="229" rx="20" fill="url(#bg)" stroke="#243029"/>
  <rect x="28" y="0" width="80" height="3" rx="1.5" fill="url(#top)"/>
  <g transform="translate(28,30)"><rect x="14" y="20" width="24" height="44" rx="3" fill="none" stroke="#D9542B" stroke-width="4"/>
      <rect x="42" y="32" width="24" height="32" rx="3" fill="none" stroke="#D9542B" stroke-width="4"/>
      <g fill="#C9DF38"><rect x="20" y="28" width="5" height="5"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></rect><rect x="29" y="28" width="5" height="5"/><rect x="20" y="38" width="5" height="5"/><rect x="29" y="38" width="5" height="5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></rect><rect x="48" y="40" width="5" height="5"/><rect x="57" y="40" width="5" height="5"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/></rect></g></g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="120" y="52" fill="#7E877F" font-size="11" font-weight="700" letter-spacing="2">NEZU ELEVATE</text>
    <text x="120" y="84" fill="#F3F4EE" font-size="26" font-weight="700">Empresas y edificios</text>
    <text x="28" y="150" fill="#A9B1A8" font-size="14">Monitoreo, control de acceso, seguridad y</text><text x="28" y="172" fill="#A9B1A8" font-size="14">automatización para oficinas, comercios</text><text x="28" y="194" fill="#A9B1A8" font-size="14">y edificios en operación.</text>
